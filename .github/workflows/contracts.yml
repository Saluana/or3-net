name: Contract Tests

on:
  push:
    paths:
      - '.github/workflows/contracts.yml'
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - 'sdk/**'
      - 'tests/contracts/**'
      - 'planning/platform-standardization/**'
  pull_request:
    paths:
      - '.github/workflows/contracts.yml'
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - 'sdk/**'
      - 'tests/contracts/**'
      - 'planning/platform-standardization/**'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run contract suites
        run: bun test tests/contracts/*.test.ts
